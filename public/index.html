<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b6e4f" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <title>vadi — Learn Slovenian</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <button id="back" class="back" type="button" hidden>‹ Home</button>
    <h1 class="wordmark">vadi</h1>
    <p class="tagline">Learn Slovenian in real-life situations</p>
  </header>

  <!-- HOME — the four learner destinations. One tap to each; everything else is one level in. -->
  <main id="home" class="home">
    <div class="tiles">
      <button class="tile" type="button" data-go="practice">
        <span class="tile-emoji">🎭</span>
        <span class="tile-title">Practice scenarios</span>
        <span class="tile-sub">Rehearse a real situation, line by line</span>
      </button>
      <button class="tile" type="button" data-go="tutor">
        <span class="tile-emoji">💬</span>
        <span class="tile-title">Live AI tutor</span>
        <span class="tile-sub">Talk out loud — the tutor replies in Slovene</span>
      </button>
      <button class="tile" type="button" data-go="replays">
        <span class="tile-emoji">↺</span>
        <span class="tile-title">Replays</span>
        <span class="tile-sub">Hear back what the tutor said</span>
      </button>
      <button class="tile" type="button" data-go="a1">
        <span class="tile-emoji">📊</span>
        <span class="tile-title">A1 Readiness</span>
        <span class="tile-sub">See what moves you toward A1</span>
      </button>
    </div>
  </main>

  <!-- ① PRACTICE — scenario list. Tap a scenario → its levels. -->
  <main id="practice" class="screen" hidden>
    <h2 class="screen-title">Practice scenarios</h2>
    <div id="scenario-list" class="scenario-list"></div>
  </main>

  <!-- ① PRACTICE — variant/level selector for one scenario. Tap a level → the rehearsal tree. -->
  <main id="levels" class="screen" hidden>
    <h2 id="levels-title" class="screen-title">—</h2>
    <div id="level-list" class="level-list"></div>
  </main>

  <!-- ② LIVE AI TUTOR — the single live surface. Push-to-talk; Slovene in/out; crediting is invisible. -->
  <main id="tutor" class="screen tutor" hidden>
    <div id="transcript" class="transcript" aria-live="polite"></div>
    <button id="talk" class="talk" disabled>
      <span id="talk-label">Hold to speak</span>
    </button>
    <p class="hint">Hold the button, speak (English + Slovenian is fine), then release.</p>
    <button id="play-fallback" class="play-fallback" hidden>▶ Tap to hear the tutor</button>
  </main>

  <!-- SPOKEN SCENE — the first-meeting surface. Full-bleed image, the character, a caption low on
       screen, one mic button, and no chrome at all: no header, no back, no counters. The mic is the
       only control, and nothing here judges what the learner says. -->
  <main id="scene" class="scene" hidden>
    <div id="scene-bg" class="scene-bg"></div>
    <!-- The three things the learner can always do TO THE RUN — hear the line slower, move on, leave.
         They live in their own layer over the background rather than beside the talk button: that button
         is the one fixed object in the run and nothing is allowed to push it. Quiet, small, upper right —
         always available, never the thing being asked for. -->
    <div id="scene-chips" class="scene-chips">
      <button id="scene-slower" class="scene-chip" type="button" title="Say it slower" aria-label="Say it slower">🐢</button>
      <button id="scene-back" class="scene-chip" type="button" title="Back to the previous line" aria-label="Back to the previous line">«</button>
      <button id="scene-skip" class="scene-chip" type="button" title="Skip to the next line" aria-label="Skip to the next line">»</button>
      <button id="scene-quit" class="scene-chip" type="button" title="Close the lesson" aria-label="Close the lesson">✕</button>
    </div>
    <!-- The on-ramp: the English that tells a first-time learner what this is, what is about to happen,
         what to do, and that nothing is at stake yet. This is what earns the right to withhold English
         once the character starts speaking. It fades before the scene begins. -->
    <!-- The stage holds everything the character says. It is a fixed region so the caption does not
         slide around as a gloss appears beneath it — the text lands in the same place every beat. -->
    <div class="scene-stage">
      <div id="scene-frame" class="scene-frame" hidden></div>
      <p id="scene-caption" class="scene-caption" aria-live="polite"></p>
      <p id="scene-gloss" class="scene-gloss"></p>
    </div>
    <!-- The controls are ALWAYS on screen and never move. The button is the one fixed object in the run:
         it changes state (the character is speaking / your turn / recording) rather than appearing and
         disappearing, so the learner always knows where the thing they act on lives. -->
    <div id="scene-controls" class="scene-controls">
      <!-- What the learner is being asked to SAY — their own upcoming line, not a gloss of the
           character's. Without it a beginner who has heard nine words and must produce two has nothing
           on screen telling them which two. -->
      <p id="scene-prompt" class="scene-prompt">
        <span id="scene-prompt-sl" class="scene-prompt-sl"></span>
        <span id="scene-prompt-en" class="scene-prompt-en"></span>
      </p>
      <button id="scene-talk" class="scene-talk" type="button">
        <!-- While the character speaks the button carries no words, just a level meter: "sound is
             happening, and it is not yours". It is the same object that will become your turn. -->
        <span id="scene-talk-bars" class="scene-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span id="scene-talk-label" class="scene-talk-label"></span>
      </button>
    </div>
    <!-- The controls tutorial: the screen dims, one chip stays lit, and a line of English says what it
         does. The chips themselves are never moved or copied — the scrim goes UNDER them, so the thing
         the learner is being shown is the actual button they will press. -->
    <div id="scene-tutorial" class="scene-tutorial" hidden>
      <p id="scene-tutorial-text" class="scene-tutorial-text"></p>
      <p class="scene-tutorial-next">Tap to continue</p>
    </div>
    <!-- The close: his last line stays up, unglossed. Key Phrases is a button, not a screen you must
         pass through — no counts, no badges, nothing that reads as a measure. -->
    <div id="scene-close" class="scene-close" hidden>
      <!-- Carrying on is the default, so it leads: the solid button, first, in the same place every
           lesson. Everything under it is optional and quieter. -->
      <button id="scene-next" class="scene-close-btn" type="button">Next lesson</button>
      <div id="scene-phrases" class="scene-phrases" hidden></div>
      <button id="scene-phrases-btn" class="scene-close-btn ghost" type="button">Key Phrases</button>
      <!-- The two ways to take this lesson further, folded away until asked for: the same material read
           and listened to at your own pace, or spoken live with the tutor carrying this scene. The menu
           hangs off the button rather than sitting in the column, so opening it moves nothing else. -->
      <div class="scene-deeper-wrap">
        <button id="scene-deeper-btn" class="scene-close-btn ghost" type="button">Go Deeper</button>
        <div id="scene-deeper" class="scene-deeper" hidden>
          <button id="scene-deeper-read" class="scene-close-btn ghost" type="button">Reading / Listening</button>
          <button id="scene-deeper-speak" class="scene-close-btn ghost" type="button">Speaking</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ③ REPLAYS — play back a past live session, tutor lines from the store (free). -->
  <main id="replays" class="screen" hidden>
    <h2 class="screen-title">Replays</h2>
    <div id="runs-panel" class="runs-panel"></div>
  </main>

  <!-- ④ A1 READINESS — the coverage map (mockup). The ONLY place progress is visible. -->
  <main id="a1" class="screen" hidden>
    <h2 class="screen-title">A1 Readiness</h2>
    <div id="a1-body" class="a1-body"></div>
  </main>

  <!-- Rehearsal tree overlay: click through the predetermined branching dialogue. Tap a line to reveal
       English; play buttons appear only once its audio is built. No mic, no server turn, no credit. -->
  <div id="dialogue" class="story-overlay" hidden>
    <div class="story-card dialogue-card">
      <button id="dialogue-close" class="story-close" type="button" aria-label="Close">✕</button>
      <p id="dialogue-title" class="practice-label">—</p>
      <div id="dialogue-convo" class="dialogue-convo" aria-live="polite"></div>
      <!-- Intro phase: while the audio "story" plays over the full background, this is the only control
           shown ("skip >>>", or "play intro" for a learner who skipped before). It fades out and the
           conversation fades in when the intro ends or is skipped. -->
      <button id="dialogue-intro" class="dialogue-intro" type="button" hidden></button>
      <div id="dialogue-choices" class="dialogue-choices"></div>
      <!-- Introduce→reinforce handoff: drop from the rehearsed tree straight into a live chat biased
           toward exactly the learnables this level introduced, where mastery is earned. -->
      <button id="dialogue-handoff" class="dialogue-handoff" type="button" hidden>Now try it for real →</button>
    </div>
  </div>

  <!-- Observability overlay — dev only; shown on the live-tutor screen so pipeline failures are visible. -->
  <section id="obs" class="obs" hidden>
    <div class="obs-row"><span>state</span><b id="obs-state">idle</b></div>
    <div class="obs-row"><span>providers</span><b id="obs-providers">—</b></div>
    <div class="obs-row"><span>heard</span><b id="obs-heard">—</b></div>
    <div class="obs-row"><span>tutor</span><b id="obs-tutor">—</b></div>
    <div class="obs-row"><span>correction</span><b id="obs-correction">—</b></div>
    <div class="obs-row"><span>timings</span><b id="obs-timings">—</b></div>
    <div class="obs-row error"><span>error</span><b id="obs-error">—</b></div>
  </section>

  <script src="/app.js" type="module"></script>
</body>
</html>
